<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --fg:#1f2937; --muted:#6b7280; --bg:#fff; --accent:#0e7490; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1f2937; --accent:#22d3ee; } }
  body { font: 14px system-ui, sans-serif; color: var(--fg); background: var(--bg); width: 280px; margin: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { margin: 6px 0; color: var(--muted); }
  button { width: 100%; padding: 8px; margin-top: 6px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  a { color: var(--accent); }
  #status { color: var(--fg); }
</style>
</head>
<body>
  <h1>E-REDES → Home Assistant</h1>
  <p id="status">A carregar…</p>
  <button id="login">Abrir Balcão Digital</button>
  <button id="send">Enviar token agora</button>
  <p><a href="options.html" target="_blank">Opções</a></p>
  <script src="popup.js"></script>
</body>
</html>
